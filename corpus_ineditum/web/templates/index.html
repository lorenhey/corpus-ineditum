<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORPUS INEDITUM</title>
    <style>
        body {
            font-family: "Georgia", serif;
            background-color: #fdfbf7;
            color: #2c2c2c;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
        }
        h1 {
            font-weight: normal;
            letter-spacing: 2px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.5rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-bottom: 3rem;
        }
        .search-container {
            border: 1px solid #ccc;
            padding: 2rem;
            background: #fff;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }
        input[type="text"] {
            width: 80%;
            padding: 0.5rem;
            font-family: inherit;
            font-size: 1.1rem;
            border: 1px solid #999;
        }
        button {
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 1.1rem;
            background: #eee;
            border: 1px solid #999;
            cursor: pointer;
        }
        button:hover {
            background: #ddd;
        }
        .footer {
            margin-top: 4rem;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>CORPUS INEDITUM</h1>
    <div class="subtitle">A bibliographic archaeology of works that may never have crossed a language.</div>
    
    <div class="search-container">
        <form action="/search" method="post">
            <label for="query">Audit a work (Title or Author):</label><br><br>
            <input type="text" id="query" name="query" placeholder="e.g. Principia Mathematica" required>
            <button type="submit">Audit</button>
        </form>
    </div>

    <div class="footer">
        "Proving that a translation exists is easy enough. Proving that it does not is where the trouble begins."
    </div>
</body>
</html>
