[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corpus-ineditum"
version = "0.1.0"
description = "A bibliographic archaeology of works that may never have crossed a language."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Loren", email = "loren@example.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.16",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "tenacity>=8.3.0",
    "rapidfuzz>=3.9.0",
    "hishel>=0.0.32",
    "beautifulsoup4>=4.12.3",
    "SPARQLWrapper>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0"
]

[project.scripts]
corpus-ineditum = "corpus_ineditum.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
strict = true
ignore_missing_imports = true
